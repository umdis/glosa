schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  Glosa — "Turn footage into footnotes". Espacio de investigación con IA que convierte horas de
  video en conocimiento buscable y citable: cada respuesta enlaza al minuto exacto que la respalda
  y cada cita se verifica contra la fuente.

  Contexto: proyecto del Meta Global AI Developer Hackathon (track Indie, tema "Build for Your
  World"). Entrega el 4-nov-2026 a las 21:00 ET; objetivo interno, el 3-nov.
  - Rúbrica: Impacto 30 %, Uso de las herramientas de IA de Meta 25 %, Demo 25 %,
    Profundidad técnica 20 %.
  - Debe usar los modelos de Meta (Meta Model API: Muse Spark, Muse Voice Transcribe, SAM 3.1,
    Muse Image/Wonder; modelos abiertos Muse Spark Open / Muse Glimmer).
  - Solo trabajo nuevo: nada de código de proyectos previos (en particular YT-Projects).
  - Evitar parecer un "RAG básico" (proyecto vetado): lo que distingue a Glosa es la comprensión
    multimodal del video, las citas verificadas y el agente investigador con aprobación humana.
  - Contenido de la demo: solo videos con permiso o con licencia abierta (p. ej. Creative Commons).

  Stack: por decidir en la primera propuesta.
  Idioma: specs, propuestas y commits en español; README y textos de cara a los jueces en inglés.

# Per-artifact rules (optional)
rules:
  proposal:
    - "Incluir siempre la sección de no objetivos, porque el plazo es de días y el alcance se recorta sin piedad."
    - "Indicar qué criterio de la rúbrica mueve cada capacidad propuesta."
  tasks:
    - "Tareas de máximo ~2 horas; marcar cuáles son imprescindibles para la demo."
